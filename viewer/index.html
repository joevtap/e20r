<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>e20r · Effect adoption</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='3' height='6' rx='1' fill='%232a78d6'/%3E%3Crect x='6.5' y='5' width='3' height='10' rx='1' fill='%232a78d6'/%3E%3Crect x='12' y='1' width='3' height='14' rx='1' fill='%232a78d6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">e20r</span>
        <span class="brand-title">Effect adoption in TypeScript</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button role="tab" data-tab="overview">Overview</button>
        <button role="tab" data-tab="repos">Repositories</button>
        <button role="tab" data-tab="symbols">Symbols</button>
        <button role="tab" data-tab="data">Data</button>
      </nav>
      <div class="topbar-end">
        <span id="db-status" class="db-status" aria-live="polite"></span>
        <label class="toggle" title="Refresh when the database changes (e.g. while a run is writing)">
          <input id="live-toggle" type="checkbox" checked /> Live
        </label>
        <button id="theme-toggle" class="ghost" type="button" aria-label="Color theme"></button>
      </div>
    </header>

    <form id="filters" class="filters" aria-label="Filters">
      <label class="field grow">
        <span>Repository</span>
        <input id="f-q" type="search" placeholder="name or topic" autocomplete="off" />
      </label>
      <label class="field">
        <span>Status</span>
        <select id="f-status">
          <option value="processed">all processed</option>
          <option value="adopters">adopters</option>
          <option value="analyzed">analyzed</option>
          <option value="excluded">excluded</option>
          <option value="selected">awaiting analysis</option>
          <option value="not-adopter">not adopters</option>
          <option value="failed">failed</option>
        </select>
      </label>
      <label class="field narrow">
        <span>Min ★</span>
        <input id="f-stars" type="number" min="0" step="1000" inputmode="numeric" placeholder="0" />
      </label>
      <label class="field">
        <span>Code</span>
        <select id="f-role">
          <option value="all">all files</option>
          <option value="authored">hand-written</option>
          <option value="source">production</option>
          <option value="test">tests</option>
          <option value="generated">generated</option>
        </select>
      </label>
      <label class="field">
        <span>Symbol position</span>
        <select id="f-kind">
          <option value="all">any</option>
          <option value="call">call</option>
          <option value="property-access">property access</option>
          <option value="type-reference">type reference</option>
          <option value="identifier">bare identifier</option>
        </select>
      </label>
      <button id="f-reset" class="ghost" type="button">Reset</button>
    </form>

    <main id="view" tabindex="-1"></main>

    <aside id="drawer" class="drawer" hidden aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <button id="drawer-close" class="ghost" type="button" aria-label="Close">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <script src="charts.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
